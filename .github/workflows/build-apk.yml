name: Build CipheLink APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Check Firebase config
        run: |
          test -f app/google-services.json
          echo "Firebase configuration found."

      - name: Restore stable keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CIPHELINK_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"

          python3 - <<'PY'
          import os
          import base64

          data = os.environ["KEYSTORE_BASE64"]
          data = "".join(data.split())

          padding = len(data) % 4
          if padding:
              data += "=" * (4 - padding)

          decoded = base64.b64decode(data, validate=False)

          if not decoded:
              raise SystemExit("Keystore decode produced empty data.")

          with open("debug.keystore", "wb") as f:
              f.write(decoded)

          print("Stable keystore restored.")
          PY

          test -s debug.keystore

      - name: Verify signing certificate
        run: |
          echo "===== SIGNING CERTIFICATE ====="
          keytool -list -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey | grep -E "SHA1:|SHA256:"
          echo "=============================="

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CipheLink-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
