name: Build CipheLink APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Check Firebase config
        run: |
          test -f app/google-services.json
          echo "Firebase configuration found."

      - name: Create debug keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Show signing SHA-1 and SHA-256
        run: |
          echo "===== DEBUG SIGNING CERTIFICATE ====="
          keytool -list -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey | grep -E "SHA1:|SHA256:"
          echo "====================================="

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CipheLink-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
