name: Build CipheLink APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Check Firebase config
        run: |
          test -f app/google-services.json
          echo "Firebase configuration found."

      - name: Restore stable keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CIPHELINK_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          CLEAN_BASE64="$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')"
          printf '%s' "$CLEAN_BASE64" | base64 -d -i > debug.keystore
          test -s debug.keystore
          echo "Stable keystore restored."

      - name: Verify signing certificate
        run: |
          echo "===== SIGNING CERTIFICATE ====="
          keytool -list -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey | grep -E "SHA1:|SHA256:"
          echo "=============================="

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CipheLink-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
